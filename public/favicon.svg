<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111c38" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0077b6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Outer Pill Container -->
  <g filter="url(#shadow)">
    <rect x="36" y="160" width="440" height="192" rx="96" fill="#ffffff" stroke="#1e293b" stroke-width="12" />
    
    <!-- PVC Text -->
    <text x="180" y="280" font-family="Arial Black, Impact, -apple-system, sans-serif" font-size="108" font-weight="900" fill="#0099f7" text-anchor="middle" letter-spacing="-2">PVC</text>
    
    <!-- 4 Blue Badge -->
    <rect x="296" y="196" width="138" height="120" rx="34" fill="url(#blueGrad)" />
    <text x="365" y="287" font-family="Arial Black, Impact, -apple-system, sans-serif" font-size="104" font-weight="900" fill="#ffffff" text-anchor="middle">4</text>
  </g>
</svg>
