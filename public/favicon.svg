<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="p4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="116" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#38bdf8" stroke-width="6" opacity="0.2" filter="url(#glow)" />
  <circle cx="256" cy="256" r="170" fill="none" stroke="#2563eb" stroke-width="4" opacity="0.3" />

  <!-- Reactor Core Hexagon / Shield -->
  <g filter="url(#shadow)">
    <polygon points="256,64 426,162 426,350 256,448 86,350 86,162" fill="#090d16" stroke="url(#p4Grad)" stroke-width="14" stroke-linejoin="round" />
  </g>

  <!-- Inner P4 Typography & Accent -->
  <g filter="url(#shadow)">
    <!-- P4 Text with Bold Industrial Style -->
    <text x="256" y="295" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="168" font-weight="900" fill="url(#p4Grad)" text-anchor="middle" letter-spacing="-4">P4</text>
  </g>

  <!-- Top Status Dot (Active Glow) -->
  <circle cx="256" cy="116" r="14" fill="#22c55e" filter="url(#glow)" />
  <circle cx="256" cy="116" r="10" fill="#4ade80" />

  <!-- Bottom Mini Label -->
  <rect x="180" y="376" width="152" height="42" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="256" y="403" font-family="system-ui, sans-serif" font-size="20" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="3">REACTOR</text>
</svg>
